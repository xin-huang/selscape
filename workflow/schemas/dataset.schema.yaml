$schema: "http://json-schema.org/draft-06/schema#"
description: "Dataset configuration for selscape pipeline"

type: object
additionalProperties: false

properties:
  dataset:
    type: string
    description: "Unique dataset identifier"

  species:
    type: string
    description: "Species name"

  tax_id:
    type: integer
    description: "NCBI taxonomy ID"

  ref_genome:
    type: string
    description: "Reference genome build (e.g., hg38)"

  anc_alleles:
    type: ["object", "null"]
    properties:
      path:
        type: string
        description: "Base folder for ancestral allele information"
      prefix:
        type: string
        description: "Ancestral allele information filename prefix"
      chr_prefix:
        type: string
        description: "Optional chromosome prefix for ancestral allele filenames (e.g. 'chr')"
    description: "Ancestral allele information for polarization"

  genome_annotation:
    type: string
    description: "Path to genome annotation GTF file"

  gene2go:
    type: string
    description: "Path to gene2go mapping file"

  hwe_pvalue:
    type: number
    minimum: 0.0
    maximum: 1.0
    default: 0.001
    description: "Hardy-Weinberg equilibrium p-value threshold"

  rmsk:
    type: ["string", "null"]
    description: "Path to repeat masker BED file"

  seg_dup:
    type: ["string", "null"]
    description: "Path to segmental duplications BED file"

  sim_rep:
    type: ["string", "null"]
    description: "Path to simple repeats BED file"

  ploidy:
    type: integer
    description: "Organism ploidy"

  populations:
    type: array
    items:
      type: string
    minItems: 1
    description: "List of population IDs to analyze"

  data_folder:
    type: string
    description: "Base folder for input VCF files"

  vcf_prefix:
    type: string
    description: "VCF filename prefix"

  vcf_suffix:
    type: string
    description: "VCF filename suffix"

  metadata:
    type: string
    description: "Path to sample metadata file"

  chromosomes:
    type: array
    items:
      oneOf:
        - type: integer
        - type: string
    minItems: 1
    description: "List of chromosomes to analyze"

required:
  - dataset
  - species
  - tax_id
  - ref_genome
  - hwe_pvalue
  - ploidy
  - populations
  - data_folder
  - vcf_prefix
  - vcf_suffix
  - metadata
  - chromosomes
